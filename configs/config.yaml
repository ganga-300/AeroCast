# Single source of truth for confirmed experimental decisions.
# See docs/decision_register.md for the evidence and rationale behind each value.

data:
  raw_path: data/raw/flights.csv
  raw_sha256: 8bdc6abbf07ac0cbb1036bc14a787cab3eea616be46c31899d2d8048963b08aa

prediction:
  # D3: every flight on date D is scored at the end of D-1 (00:00 NYC local time on D).
  timestamp_rule: end_of_previous_day
  # D10 (CONFIRMED): historical features for a flight on date D may use only outcomes of
  # flights with flight date <= D - history_lag_days. Lag 1 would include D-1 flights that
  # provably landed after 00:00 on D (19,303 labelled rows); lag 2 has zero such violations.
  history_lag_days: 2

target:
  # D6: y = 1 if arr_delay >= threshold, 0 if below, <NA> if arr_delay is missing.
  source_column: arr_delay
  threshold_minutes: 15

population:
  # D4: only rows with a recorded arrival-delay label enter training and evaluation.
  require_recorded_label: true

split:
  # D5: inclusive date ranges on the verified flight date.
  train: {start: "2013-01-01", end: "2013-08-31"}
  validation: {start: "2013-09-01", end: "2013-10-31"}
  test: {start: "2013-11-01", end: "2013-12-31"}

features:
  # Stage 4. Month is deliberately excluded: training covers Jan-Aug only, so Sep-Dec values
  # would be unseen (EDA Q6, decision D15).
  history:
    # Entities whose past arrival-delay rate is aggregated (D16). Outcomes come only from
    # flights with flight date <= D - prediction.history_lag_days.
    entities: [carrier, origin, dest, route]
    entity_windows_days: [28]        # plus an expanding window from the first data date
    global_windows_days: [7, 28]     # system-wide rates (plus expanding)
    min_count: 20                    # below this many labelled outcomes -> fall back to prior
    smoothing_m: 20                  # pseudo-count weight of the prior in shrunk rates

preprocessing:
  # Stage 6 (D19, D24). Categories with fewer labelled TRAINING flights than this are grouped
  # into one "infrequent" one-hot column; unseen validation/test categories map to that column
  # (or to all zeros if no category was infrequent). Fixed a priori, not tuned.
  min_category_frequency: 100

models:
  # Stage 7 (D25-D27). Every configuration is trained on Jan-Aug only and compared on
  # validation Average Precision. "train_balanced" means negatives/positives computed from
  # TRAINING labels only.
  logistic_regression:
    C: [0.01, 0.1, 1.0, 10.0]
    class_weight: [null, balanced]
    max_iter: 5000
  xgboost:
    max_depth: [3, 5, 7]
    min_child_weight: [1, 20]
    scale_pos_weight: [1.0, train_balanced]
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    n_estimators_max: 2000
    early_stopping_rounds: 50
    early_stopping_metric: aucpr
  bootstrap_resamples: 200

calibration:
  # Stage 8 (D11, confirmed). Methods in order of simplicity (used for the tie-break).
  methods: [none, sigmoid, isotonic]
  # Validation cross-fit folds by calendar month: fit on one, score held-out log loss on the other.
  folds:
    sep: {start: "2013-09-01", end: "2013-09-30"}
    oct: {start: "2013-10-01", end: "2013-10-31"}
  criterion: mean_heldout_log_loss   # unweighted mean of the two folds' log losses
  tie_tolerance: 1.0e-6              # within this, prefer the simpler method
  primary_model: logistic_regression # D29
  comparison_model: xgboost

operating_point:
  # D7: chosen on validation predictions only, then frozen.
  min_precision: 0.70
  rule: maximise_recall_subject_to_min_precision
  tie_break: highest_threshold

seed: 42
