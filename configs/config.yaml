# Single source of truth for confirmed experimental decisions.
# See docs/decision_register.md for the evidence and rationale behind each value.

data:
  raw_path: data/raw/flights.csv
  raw_sha256: 8bdc6abbf07ac0cbb1036bc14a787cab3eea616be46c31899d2d8048963b08aa

prediction:
  # D3: every flight on date D is scored at the end of D-1 (00:00 NYC local time on D).
  timestamp_rule: end_of_previous_day
  # D10 (CONFIRMED): historical features for a flight on date D may use only outcomes of
  # flights with flight date <= D - history_lag_days. Lag 1 would include D-1 flights that
  # provably landed after 00:00 on D (19,303 labelled rows); lag 2 has zero such violations.
  history_lag_days: 2

target:
  # D6: y = 1 if arr_delay >= threshold, 0 if below, <NA> if arr_delay is missing.
  source_column: arr_delay
  threshold_minutes: 15

population:
  # D4: only rows with a recorded arrival-delay label enter training and evaluation.
  require_recorded_label: true

split:
  # D5: inclusive date ranges on the verified flight date.
  train: {start: "2013-01-01", end: "2013-08-31"}
  validation: {start: "2013-09-01", end: "2013-10-31"}
  test: {start: "2013-11-01", end: "2013-12-31"}

operating_point:
  # D7: chosen on validation predictions only, then frozen.
  min_precision: 0.70
  rule: maximise_recall_subject_to_min_precision
  tie_break: highest_threshold

seed: 42
